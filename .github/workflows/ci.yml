name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: worker.js must be up to date with the sources
        run: |
          python3 build_worker.py
          git diff --exit-code worker.js || (echo "worker.js is stale: run python3 build_worker.py and commit it" && exit 1)
      - run: node --check worker.js
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
