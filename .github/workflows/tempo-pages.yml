name: Deploy Tempo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['tempo/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          B="${GITHUB_SHA::7} · $(TZ=Asia/Jerusalem date '+%d.%m.%Y %H:%M')"
          sed -i "s|__BUILD__|$B|g" tempo/index.html tempo/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tempo
      - run: sleep 10
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
