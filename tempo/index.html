 else if(BUS.res)h+=(BUS.far>3000?`<div class="wr" style="background:var(--fl)"><div class="gt"><span class="sub">${t('Nearest stop is far')}: ${(BUS.far/1000).toFixed(1)} km · ${t('City')}: ${esc(S.set.city)}</span></div></div>`:'')+BUS.res.map(r=>`<div class="card bs"><div class="bh"><b>${esc(r.stop.name)}</b><span class="sub">🚶 ${r.walk} ${t('min')} · <bdi dir="ltr">${r.stop.d<1000?Math.round(r.stop.d)+' m':(r.stop.d/1000).toFixed(1)+' km'}</bdi></span></div>${r.rows.length?r.rows.map(x=>busRow(x,r.walk)).join(''):`<div class="empty" style="padding:14px 0">${t('No buses soon')}</div>`}</div>`).join('');
 b.innerHTML=h;fitRows()}
function citySheet(){openSh(`<div class="shd">${t('City')}</div><input class="f" id="cy" value="${esc(S.set.city)}" dir="auto" autocomplete="off" enterkeyhint="done"><div class="sub" style="text-align:center;margin-bottom:10px">${t('Exactly as in the stops list, for example נהריה')}</div><div class="alt" style="margin:0 0 14px"><button class="pill" onclick="busDebug()">${t('Debug')}</button></div><div class="trio"><button class="ib p" id="cys" aria-label="save">${ic('check')}</button></div><div class="why"></div>`,s=>{const g=()=>gate($('#cys'),$('#cy').value.trim()?'':t('Write a city name first'),s.querySelector('.why'),'cy');g();$('#cy').oninput=g;const go=()=>{const v=$('#cy').value.trim();if(v){S.set.city=v;save();closeSh();render(0,true);busLoad()}};$('#cys').onclick=go;$('#cy').onkeydown=e=>{if(e.key=='Enter')go()}})}
function busDebug(){const short=o=>{try{return JSON.parse(JSON.stringify(o,(k,v)=>typeof v=='string'&&v.length>80?v.slice(0,80)+'…':v))}catch(e){return null}};
 const d=JSON.stringify({city:S.set.city,from:BUS.from,loc:BUS.loc,counts:{vehicleRows:BD.vlCount,matchedRides:BD.vlMatched},errors:{main:BD.err,rideStops:BD.rsErr,vehicles:BD.vlErr},sample:{stop:short(BD.stop),rideStop:short(BD.rs),vehicle:short(BD.vl)}},null,1);
 openSh(`<div class="shd">${t('Debug')}</div><textarea class="f nt" rows="14" readonly onclick="this.select()" style="font-size:12px;font-family:ui-monospace,monospace">${esc(d)}</textarea>`)}
/* ---------- boot ---------- */
load();S.set.focusOn=false;applyLang();render(1);setTimeout(startWatch,1500);setTimeout(()=>{pushSync();cloudBackup(false)},3000);if(!S.set.onboarded)setTimeout(()=>onboard(false),250);

setInterval(()=>{due();if(tab==0&&!$('#sh')){const H=heroNext(),u=(id,v)=>{const e=$('#'+id);if(e&&e.innerHTML!=v)e.innerHTML=v};u('hk',H.k);u('hv',H.h);u('hl',H.l);u('hf',freeLine());const bw=$('#bw');if(bw){const x=bar(today());if(bw.innerHTML!=x)bw.innerHTML=x}}},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){due();if(!$('#sh')){if(sel<today()&&tab!=1)sel=today();render(0,true)}}});
due();
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!$('#sh')&&!window.__rl){window.__rl=1;location.reload()}})}
</script></body></html>
