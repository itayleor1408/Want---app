<style>

.li{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:54px;border-top:1px solid var(--hr);cursor:pointer}.li:first-child{border-top:0}

.dy.td b{color:var(--a)}.dy.on{background:var(--t);color:var(--bg)}.dy.on small,.dy.on b{color:var(--bg)}.dy.on .dots i{background:var(--bg)}

#ts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--t);color:var(--bg);padding:12px 8px 12px 18px;border-radius:24px;font-weight:700;font-size:14.5px;z-index:30;display:flex;gap:10px;align-items:center;transition:transform .35s var(--spring),opacity .25s;pointer-events:none}#ts.o{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#ts button{padding:4px 12px;border-radius:14px;background:rgba(127,127,127,.3);font-weight:800}

.xb{width:100%;display:flex}
.hero{padding:18px 0 14px}.hero .sub{font-size:15px}

.bar{position:relative;height:14px;border-radius:9px;background:var(--fl);overflow:hidden;margin:2px 0 4px}.bar i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--t);opacity:.85}.bar i.tv{opacity:.3}.bar b{position:absolute;top:0;bottom:0;width:3px;background:var(--a);border-radius:2px}

.dy.on .ld{--k:rgba(127,127,127,.45);--f:var(--bg)}.dy.on .ld.hi{--f:var(--r)}
.wr{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--r) 10%,var(--c));border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}.wr b{display:block;font-weight:800}.wr .sub{font-size:13.5px;display:block}
.fit{padding:6px 11px;font-size:13px;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);flex:none}
</style></head><body><div id="app"></div>
<div class="fabs"><button class="ib" id="gb" aria-label="Settings"></button><button class="ib p" id="fab" aria-label="Add" style="background:var(--t);color:var(--bg)"></button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* ---------- icons ---------- */
const P={today:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',week:'<rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',later:'<path d="M5 7h14M5 12h14M5 17h9"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/>',left:'<path d="M14.5 6l-6 6 6 6"/>',right:'<path d="M9.5 6l6 6-6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.1"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
const ic=(n,s=24)=>`<svg class="${n=='left'||n=='right'?'fl':''}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
/* ---------- i18n ---------- */
const HE={'Today':'היום','Week':'שבוע','Later':'אחר כך','New':'חדש','Edit':'עריכה','Settings':'הגדרות','Next up':'הבא','Now':'עכשיו','Free':'פנוי','All clear':'הכול בוצע','left':'נשארו','Done':'בוצעו','Left':'נותרו','Missed':'הוחמצו','Nothing planned. Tap + to add.':'אין תוכניות. לחצו + להוספה.','Nothing here. Tap + to add.':'אין כלום. לחצו + להוספה.','Title':'כותרת','What\'s the plan? e.g. Gym tomorrow 18:30 1h':'מה התוכנית? למשל: חדר כושר מחר 18:30 שעה','Date':'תאריך','Time':'שעה','Duration':'משך','Remind me':'תזכורת','Repeat':'חזרה','Off':'כבוי','At time':'בזמן','before':'לפני','Never':'לא','Daily':'יומי','Weekly':'שבועי','Save':'שמירה','Delete':'מחיקה','Deleted':'נמחק','Undo':'ביטול','General':'כללי','Language':'שפה','Theme':'עיצוב','Light':'בהיר','System':'מערכת','Dark':'כהה','Week starts':'השבוע מתחיל','Sun':'א׳','Mon':'ב׳','Reminders':'תזכורות','Notifications':'התראות','Default reminder':'תזכורת ברירת מחדל','Send a test':'שלח בדיקה','Data':'נתונים','Export backup':'ייצוא גיבוי','Import backup':'ייבוא גיבוי','Erase everything':'מחיקת הכול','Erase all your plans?':'למחוק את כל התוכניות?','Imported':'יובא','Test from Tempo':'בדיקה מ-Tempo','It works.':'זה עובד.','Starting now':'מתחיל עכשיו','Starts in':'מתחיל בעוד','min':'דק׳','in':'בעוד','Allowed':'מותר','Blocked in browser settings':'חסום בהגדרות הדפדפן','Needs Add to Home Screen first':'צריך קודם להוסיף למסך הבית','Quick add':'הוספה מהירה','Whole day':'כל היום','Tap to add a time':'ללא שעה','Notifications are not supported here.':'ההתראות לא נתמכות כאן.',
'Free today':'פנוי היום','Day is done':'היום הסתיים','Biggest gap':'החלון הגדול','Fully booked':'היום תפוס','Fit in':'תכניס','Placed':'הוכנס','No room in the next 2 weeks':'אין מקום בשבועיים הקרובים','Travel':'זמן נסיעה','None':'בלי','Leave by':'לצאת עד','Leave now':'צא עכשיו','Leave in':'צא בעוד','Heavy day':'יום עמוס','Packed':'עמוס','booked':'תפוסות','without a break':'בלי הפסקה','Lighten it':'הקל על היום','Moved':'הועבר','Move':'להעביר','to':'אל','Your day':'היום שלך','Day starts':'היום מתחיל','Day ends':'היום נגמר','info.day':'זמן פנוי נספר רק בין השעות האלה.',
'info.notif':'התראות מופיעות כשהאפליקציה פתוחה או ברקע. באייפון צריך קודם "הוסף למסך הבית". כשהאפליקציה סגורה לגמרי אין התראה בלי שרת דחיפה.','info.rem':'כמה זמן לפני כל אירוע חדש להתריע.','info.quick':'אפשר לכתוב בשפה חופשית: "פגישה מחר 14:00 שעה" והאפליקציה תמלא לבד.','info.data':'הכול נשמר רק בטלפון הזה. מומלץ לייצא גיבוי מדי פעם.'};
const EN={'info.day':'Free time is only counted between these hours.','info.notif':'Alerts show while the app is open or in the background. On iPhone, Add to Home Screen first. With the app fully closed there is no alert without a push server.','info.rem':'How long before a new event to alert you.','info.quick':'Type naturally: "Dentist tomorrow 14:00 1h" and Tempo fills in the rest.','info.data':'Everything is stored only on this phone. Export a backup now and then.'};
let S;const lang=()=>S.set.lang,t=k=>lang()=='he'?(HE[k]||k):(EN[k]||k);
const loc=()=>lang()=='he'?'he-IL':'en-GB';
/* ---------- state ---------- */
const KEY='tempo.v1';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.items)S={items:[],set:{}};S.set=Object.assign({lang:/^he/.test(navigator.language)?'he':'en',theme:'',ws:0,notif:true,rem:10,ds:8,de:22},S.set);S.fired=S.fired||{}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- dates ---------- */
const z=n=>String(n).padStart(2,'0'),dk=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date()),nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m},ft=m=>`${z(Math.floor(m/60)%24)}:${z(m%60)}`;
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtD=(s,o)=>new Intl.DateTimeFormat(loc(),o).format(pd(s));
const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m}m`;
function weekStart(s){const d=pd(s);const diff=(d.getDay()-S.set.ws+7)%7;d.setDate(d.getDate()-diff);return dk(d)}
/* ---------- model ---------- */
function hit(it,ds){if(!it.date)return false;if(ds<it.date)return false;if(!it.rep||it.rep=='none')return ds==it.date;const n=dayDiff(it.date,ds);return it.rep=='daily'||n%7==0}
const isDone=(it,ds)=>!!(it.done&&it.done[ds||'x']);
const byTime=(a,b)=>(a.time?tm(a.time):-1)-(b.time?tm(b.time):-1)||a.title.localeCompare(b.title);
const occ=ds=>S.items.filter(i=>hit(i,ds)).sort(byTime);
const later=()=>S.items.filter(i=>!i.date).sort((a,b)=>isDone(a)-isDone(b)||a.created-b.created);
const missed=()=>{const t=today(),out=[];S.items.forEach(i=>{if(i.date&&(!i.rep||i.rep=='none')&&i.date<t&&i.date>=addD(t,-14)&&!isDone(i,i.date))out.push(i)});return out.sort((a,b)=>a.date.localeCompare(b.date))};
function toggle(id,ds){const it=S.items.find(i=>i.id==id);it.done=it.done||{};const k=ds||'x';if(it.done[k])delete it.done[k];else it.done[k]=1;save();render(0,true)}
/* ---------- free time, load, fit ---------- */
const hm=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:`${m}m`;
const WIN=()=>[S.set.ds*60,S.set.de*60],up5=m=>Math.ceil(m/5)*5;
function busy(ds){const a=[];occ(ds).forEach(i=>{if(!i.time||isDone(i,ds))return;const s=tm(i.time);a.push([s-(i.trav||0),s+Math.max(i.dur||0,15),i])});return a.sort((x,y)=>x[0]-y[0])}
function merge(a){const o=[];a.forEach(([s,e])=>{const l=o[o.length-1];if(l&&s<=l[1])l[1]=Math.max(l[1],e);else o.push([s,e])});return o}
function gaps(ds,from){const[ws,we]=WIN();let cur=Math.max(ws,from||0);const out=[];for(const[s,e]of merge(busy(ds))){if(e<=cur)continue;if(s>cur)out.push([cur,Math.min(s,we)]);cur=Math.max(cur,e);if(cur>=we)break}if(cur<we)out.push([cur,we]);return out.filter(g=>g[1]>g[0])}
const gFrom=d=>d==today()?up5(nowMin()):0;
function stats(ds){const[ws,we]=WIN(),m=merge(busy(ds));const tot=m.reduce((a,x)=>a+Math.max(0,Math.min(x[1],we)-Math.max(x[0],ws)),0);let best=0,run=0,pe=null;m.forEach(([s,e])=>{run=pe!=null&&s-pe<15?run+e-pe:e-s;pe=e;best=Math.max(best,run)});const load=tot/(we-ws);return{tot,load,stretch:best,over:load>=.75||best>=240}}
function freeInfo(){const[,we]=WIN(),n=nowMin();if(n>=we)return{over:1,tot:0};const g=gaps(today(),Math.max(up5(n),0));return{tot:g.reduce((a,x)=>a+x[1]-x[0],0),big:g.reduce((a,x)=>!a||x[1]-x[0]>a[1]-a[0]?x:a,null)}}
function hero(){const f=freeInfo();return[f.over?'0m':hm(f.tot),f.over?t('Day is done'):f.big?`${t('Biggest gap')} · ${ft(f.big[0])}–${ft(f.big[1])}`:t('Fully booked')]}
function nowNext(){const td=today(),n=nowMin(),its=occ(td).filter(i=>i.time&&!isDone(i,td)),e=i=>(i.emoji||'')+' '+esc(i.title);
 const cur=its.find(i=>n>=tm(i.time)&&n<tm(i.time)+Math.max(i.dur||0,1)),nxt=its.find(i=>tm(i.time)>n);
 if(cur){const l=hm(tm(cur.time)+(cur.dur||1)-n);return `${t('Now')} · ${e(cur)} · ${lang()=='he'?'נותרו '+l:l+' left'}`}
 if(nxt){const lv=tm(nxt.time)-(nxt.trav||0);if(nxt.trav)return n<lv?`${t('Leave in')} ${hm(lv-n)} · ${e(nxt)}`:`${t('Leave now')} · ${e(nxt)}`;return `${t('Next up')} · ${e(nxt)} · ${t('in')} ${hm(tm(nxt.time)-n)}`}return ''}
function bar(ds){const[ws,we]=WIN(),W=we-ws,pc=x=>Math.max(0,Math.min(100,(x-ws)/W*100));
 const seg=busy(ds).map(([s,e,i])=>{const st=tm(i.time),tv=st>s?`<i class="tv" style="inset-inline-start:${pc(s)}%;width:${pc(st)-pc(s)}%"></i>`:'';return tv+`<i style="inset-inline-start:${pc(st)}%;width:${pc(e)-pc(st)}%"></i>`}).join('');
 const nm=ds==today()&&nowMin()>=ws&&nowMin()<=we?`<b style="inset-inline-start:${pc(nowMin())}%"></b>`:'';
 return `<div class="bar">${seg}${nm}</div><div class="bl"><span>${ft(ws)}</span><span>${ft(we)}</span></div>`}
function suggest(ds){const c=occ(ds).filter(i=>i.time&&!isDone(i,ds)&&(!i.rep||i.rep=='none')&&(ds!=today()||tm(i.time)>nowMin())).sort((a,b)=>tm(b.time)-tm(a.time))[0];if(!c)return null;
 const need=Math.max(c.dur||0,15)+(c.trav||0);let best=null;
 for(let k=1;k<=7;k++){const d=addD(ds,k),a=stats(d);if(a.over)continue;const g=gaps(d,gFrom(d)).find(x=>x[1]-x[0]>=need+4);if(g&&(!best||a.tot<best.tot))best={tot:a.tot,d,t:ft(up5(g[0]+(c.trav||0))),id:c.id,title:c.title}}return best}
function warn(ds){if(ds<today())return '';const a=stats(ds);if(!a.over)return '';const sg=suggest(ds);
 return `<div class="wr"><div class="gt"><b>${ds==today()?t('Heavy day'):fmtD(ds,{weekday:'long'})+' · '+t('Packed')}</b><span class="sub">${hm(a.tot)} ${t('booked')}${a.stretch>=240?' · '+hm(a.stretch)+' '+t('without a break'):''}</span>${sg?`<span class="sub">${t('Move')} ${esc(sg.title)} ${t('to')} ${fmtD(sg.d,{weekday:'short'})} ${sg.t}</span>`:''}</div>${sg?`<button class="pill" onclick="applyMove('${sg.id}','${sg.d}','${sg.t}')">${t('Lighten it')}</button>`:''}</div>`}
function applyMove(id,d,tmv){const it=S.items.find(i=>i.id==id),o={date:it.date,time:it.time};it.date=d;it.time=tmv;save();render(0,true);toast(`${t('Moved')} · ${fmtD(d,{weekday:'short'})} ${tmv}`,()=>{Object.assign(it,o);save();render(0,true)})}
function fit(id){const it=S.items.find(i=>i.id==id);if(!it)return;const need=Math.max(it.dur||30,15)+(it.trav||0),st=it.date&&it.date>=today()?it.date:today();
 for(let k=0;k<14;k++){const d=addD(st,k),g=gaps(d,gFrom(d)).find(x=>x[1]-x[0]>=need+4);if(g){const o={date:it.date,time:it.time,dur:it.dur,rem:it.rem},tv=ft(up5(g[0]+(it.trav||0)));it.date=d;it.time=tv;it.dur=it.dur||30;if(it.rem==null||it.rem<0)it.rem=S.set.rem;save();render(0,true);toast(`${t('Placed')} · ${fmtD(d,{weekday:'short'})} ${tv}`,()=>{Object.assign(it,o);save();render(0,true)});return}}
 toast(t('No room in the next 2 weeks'))}
/* ---------- quick-add parser ---------- */
const DAYS=[['sun','sunday','ראשון'],['mon','monday','שני'],['tue','tues','tuesday','שלישי'],['wed','wednesday','רביעי'],['thu','thur','thurs','thursday','חמישי'],['fri','friday','שישי'],['sat','saturday','שבת']];

const EMS=['📌','💪','💼','📚','👥','🍽️','🩺','📞','🛒','🎉','✈️','🧘','🎯','🏠','💡','❤️'];

function parse(txt,base){
 const r={title:txt,date:null,time:null,dur:null,trav:null},U='(?<![\\p{L}\\d])',V='(?![\\p{L}\\d])';
 const cut=re=>{const m=r.title.match(re);if(m)r.title=r.title.replace(re,' ');return m};
 let m;
 if(m=cut(new RegExp('(?:'+U+'(?:travel|drive|commute)|נסיעה)\\s?(\\d+)\\s?(?:minutes|mins|min|m|דקות|דק)?'+V,'iu')))r.trav=+m[1];
 if(m=cut(new RegExp(U+'(\\d{1,2})[:.](\\d{2})'+V,'iu')))r.time=`${z(+m[1]%24)}:${m[2]}`;
 else if(m=cut(new RegExp(U+'(\\d{1,2})\\s?(am|pm)'+V,'iu'))){let h=+m[1]%12;if(/pm/i.test(m[2]))h+=12;r.time=`${z(h)}:00`}
 else if(m=cut(new RegExp('(?:'+U+'at|(?<![\\p{L}])ב)\\s?(\\d{1,2})(?![\\d:])','iu')))r.time=`${z(+m[1]%24)}:00`;
 if(m=cut(new RegExp(U+'(\\d+(?:\\.\\d+)?)\\s?(?:h|hr|hrs|hours?|שעות|שעה|ש)'+V,'iu')))r.dur=Math.round(parseFloat(m[1])*60);
 else if(m=cut(new RegExp(U+'(\\d+)\\s?(?:m|min|mins|minutes?|דקות|דק)'+V,'iu')))r.dur=+m[1];
 else if(cut(new RegExp('(?<![\\p{L}])שעה(?![\\p{L}])','u')))r.dur=60;
 const T=base||today();
 if(cut(new RegExp(U+'(today|tod|היום)'+V,'iu')))r.date=T;
 else if(cut(new RegExp(U+'(tomorrow|tmr|tmrw|מחר)'+V,'iu')))r.date=addD(T,1);
 else for(let w=0;w<7&&!r.date;w++){const re=new RegExp(U+'(?:next\\s|יום\\s)?('+DAYS[w].join('|')+')'+V,'iu');if(cut(re)){const d=pd(T);r.date=addD(T,((w-d.getDay()+7)%7)||7)}}
 r.title=r.title.replace(/\s+/g,' ').trim();for(let k=0;k<3;k++)r.title=r.title.replace(/(^|\s)(at|for|on|next)$/i,'').replace(/^(at|for|on)\s/i,'').replace(/(^|\s)ב-?$/,'').trim();
 return r}

 let sub=it.time?(it.dur?`${it.time}–${ft(en)}`:it.time):(it.date?t('Whole day')+(it.dur?' · '+hm(it.dur):''):(it.dur?hm(it.dur):''));
 if(it.time&&it.trav)sub+=` · ${t('Leave by')} ${ft(st-it.trav)}`;

async function notify(title,body,tag){pillMsg(title+' · '+body);
 if(!('Notification'in window)||Notification.permission!='granted')return;
 try{const reg=await navigator.serviceWorker.getRegistration();if(reg)return reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',renotify:true});new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}}
function due(){if(!S.set.notif)return;const now=Date.now(),td=today();
 for(const ds of [addD(td,-1),td,addD(td,1)])for(const it of occ(ds)){if(!it.time||it.rem<0||it.rem==null||isDone(it,ds))continue;
  const tv=it.trav||0,at=pd(ds).getTime()+(tm(it.time)-tv-it.rem)*6e4,key=it.id+ds;
  if(now>=at&&now-at<15*6e4&&!S.fired[key]){S.fired[key]=now;save();notify(`${it.emoji||'📌'} ${it.title}`,tv?(it.rem?`${t('Leave by')} ${ft(tm(it.time)-tv)} · ${it.time}`:`${t('Leave now')} · ${it.time}`):(it.rem?`${t('Starts in')} ${it.rem} ${t('min')} · ${it.time}`:`${t('Starting now')} · ${it.time}`),key)}}
