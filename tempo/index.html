let BUS={from:'here',res:null,err:null,loading:false,t:0,loc:null,far:0},BD={};
function getLoc(){return new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),e=>rej(new Error('location')),{enableHighAccuracy:true,timeout:8000,maximumAge:30000}):rej(new Error('location')))}
async function stopsFor(city){const key='tempo.stops.'+city+'.'+today();try{const c=JSON.parse(localStorage.getItem(key));if(c&&c.length)return c}catch(e){}
 const j=await api('/gtfs_stops/list',{city,date_from:today(),date_to:today(),limit:6000});BD.stop=j[0];
 const out=j.map(s=>({id:s.id,code:s.code,name:s.name,lat:+s.lat,lon:+s.lon})).filter(s=>isFinite(s.lat)&&isFinite(s.lon));
 try{Object.keys(localStorage).filter(k=>k.startsWith('tempo.stops.')).forEach(k=>localStorage.removeItem(k));localStorage.setItem(key,JSON.stringify(out))}catch(e){}return out}
const nearest=(stops,p,n)=>stops.map(s=>({...s,d:hav(p,s)*1000})).sort((a,b)=>a.d-b.d).slice(0,n);
const destOf=(long,dir)=>{if(!long)return '';const parts=String(long).split('<->');let d=parts.length>1?(String(dir)=='2'?parts[0]:parts[1]):parts[0];return d.replace(/[-\d#]+$/,'').trim()};
async function schedFor(stop){const n=new Date(),j=await api('/gtfs_ride_stops/list',{gtfs_stop_ids:stop.id,arrival_time_from:isoTz(new Date(n.getTime()-6*6e4)),arrival_time_to:isoTz(new Date(n.getTime()+100*6e4)),order_by:'arrival_time asc',limit:80});
 if(!BD.rs)BD.rs=j[0];
 return j.map(r=>({ride:String(r.gtfs_ride_id),at:new Date(r.arrival_time),line:pick(r,'gtfs_route','route_short_name'),dest:destOf(pick(r,'gtfs_route','route_long_name'),pick(r,'gtfs_route','route_direction')),dist:+pick(r,'gtfs_ride_stop','shape_dist_traveled')}))}
async function liveNear(p){const n=new Date(),dl=.035,dn=.045;
 const j=await api('/siri_vehicle_locations/list',{lat__greater_or_equal:p.lat-dl,lat__lower_or_equal:p.lat+dl,lon__greater_or_equal:p.lon-dn,lon__lower_or_equal:p.lon+dn,recorded_at_time_from:isoTz(new Date(n.getTime()-12*6e4)),recorded_at_time_to:isoTz(n),order_by:'recorded_at_time desc',limit:1500});
 BD.vl=j[0];BD.vlCount=j.length;const by={};
 for(const v of j){const ids=['gtfs_ride_id','route_gtfs_ride_id','journey_gtfs_ride_id'].map(k=>pick(v,'siri_ride',k)).filter(x=>x!=null).map(String);if(!ids.length)continue;
  const rec=new Date(v.recorded_at_time);ids.forEach(id=>{if(!by[id]||rec>by[id].rec)by[id]={rec,lat:+v.lat,lon:+v.lon,dj:+v.distance_from_journey_start}})}
 BD.vlMatched=Object.keys(by).length;return by}
function buildRows(sched,live,stop){const now=Date.now(),rows=[];
 for(const s of sched){const v=live[s.ride];let min=null,lv=false;
  if(v){const age=(now-v.rec)/6e4;if(age<=8){let rem=s.dist-v.dj;if(!isFinite(rem)||rem>60000||rem<-60000)rem=hav({lat:v.lat,lon:v.lon},stop)*1000*1.3;
   if(rem>=-80){min=Math.max(0,rem/6.1/60-age);lv=true}else continue}}
  if(min==null){min=(s.at-now)/6e4;if(min<-1)continue}
  rows.push({line:s.line,dest:s.dest,min,live:lv,at:new Date(now+min*6e4)})}
 return rows.sort((a,b)=>a.min-b.min).slice(0,4)}
async function busLoad(silent){if(BUS.loading)return;BUS.loading=true;if(!silent){BUS.res=null;BUS.err=null;busDraw()}
 try{let p;if(BUS.from=='here'){try{p=await getLoc();BUS.loc=p}catch(e){const h=S.places.find(x=>x.home)||S.places[0];if(!h)throw new Error('location');BUS.from=h.id;p={lat:h.lat,lon:h.lon}}}else{const pl=placeOf(BUS.from)||S.places[0];if(!pl)throw new Error('location');p={lat:pl.lat,lon:pl.lon}}
  const stops=await stopsFor(S.set.city);if(!stops.length)throw new Error('no stops in '+S.set.city);const near=nearest(stops,p,3);
  const [live,...sc]=await Promise.all([liveNear(p).catch(e=>{BD.vlErr=e.message;return {}}),...near.map(s=>schedFor(s).catch(e=>{BD.rsErr=e.message;return []}))]);
  BUS.res=near.map((s,i)=>({stop:s,walk:est(p,s).w,rows:buildRows(sc[i],live,s)}));BUS.far=near[0]?near[0].d:0;BUS.err=null;BUS.t=Date.now()}
 catch(e){BUS.err=e.message||'error';BD.err=BUS.err}
 BUS.loading=false;busDraw()}
const busFrom=id=>{BUS.from=id;busLoad()};
function busView(){return `<div class="hd"><h1>${t('Buses')}</h1><span class="sub" id="bus-up"></span></div><div class="rw" id="bus-from" style="margin-bottom:12px"></div><div id="busb"></div>
 <div class="bfoot"><button class="pill" onclick="citySheet()">${t('City')}: ${esc(S.set.city)}</button><button class="pill" onclick="busDebug()">${t('Debug')}</button></div>`}
function busRow(b,walk){const m=Math.round(b.min);return `<div class="br ${m<walk-1?'dim':''}"><span class="ln">${esc(b.line==null?'?':b.line)}</span><span class="gt"><b>${esc(b.dest||'')}</b><span class="sub">${b.live?t('live'):t('schedule')} · <bdi dir="ltr">${ft(b.at.getHours()*60+b.at.getMinutes())}</bdi></span></span><span class="bm ${b.live?'lv':''}">${m<1?t('Now'):m+' '+t('min')}</span></div>`}
function busDraw(){if(tab!=3)return;const f=$('#bus-from'),b=$('#busb');if(!f||!b)return;
 f.innerHTML=`<button class="pill ${BUS.from=='here'?'on':''}" onclick="busFrom('here')">📍 ${t('Here')}</button>`+S.places.map(p=>`<button class="pill ${BUS.from==p.id?'on':''}" onclick="busFrom('${p.id}')">${p.emoji} ${esc(p.name)}</button>`).join('');
 const up=$('#bus-up');if(up)up.textContent=BUS.t?`${t('Updated')} ${ft(new Date(BUS.t).getHours()*60+new Date(BUS.t).getMinutes())}`:'';
 if(BUS.loading&&!BUS.res){b.innerHTML=`<div class="empty">${t('Loading…')}</div>`;return}
 if(BUS.err){b.innerHTML=`<div class="card"><div class="empty">${BUS.err=='location'?t('Location unavailable. Pick a saved place.'):t("Couldn't load buses")}<div class="sub" style="margin-top:6px">${esc(BUS.err=='location'?'':BUS.err)}</div></div></div><div style="text-align:center"><button class="pill" onclick="busLoad()">${t('Try again')}</button></div>`;return}
 if(!BUS.res)return;
 b.innerHTML=(BUS.far>3000?`<div class="wr" style="background:var(--fl)"><div class="gt"><span class="sub">${t('Nearest stop is far')}: ${(BUS.far/1000).toFixed(1)} km · ${t('City')}: ${esc(S.set.city)}</span></div></div>`:'')+BUS.res.map(r=>`<div class="card bs"><div class="bh"><b>${esc(r.stop.name)}</b><span class="sub">${r.stop.d<1000?Math.round(r.stop.d)+' m':(r.stop.d/1000).toFixed(1)+' km'} · ${r.walk} ${t('min')} ${t('walk')}</span></div>${r.rows.length?r.rows.map(x=>busRow(x,r.walk)).join(''):`<div class="empty" style="padding:14px 0">${t('No buses soon')}</div>`}</div>`).join('')}
function citySheet(){openSh(`<div class="shd">${t('City')}</div><input class="f" id="cy" value="${esc(S.set.city)}" dir="auto" autocomplete="off" enterkeyhint="done"><div class="sub" style="text-align:center;margin-bottom:10px">${t('Exactly as in the stops list, for example נהריה')}</div><div class="trio"><button class="ib p" id="cys" aria-label="save">${ic('check')}</button></div>`,s=>{const go=()=>{const v=$('#cy').value.trim();if(v){S.set.city=v;save();closeSh();render(0,true);busLoad()}};$('#cys').onclick=go;$('#cy').onkeydown=e=>{if(e.key=='Enter')go()}})}
function busDebug(){const short=o=>{try{return JSON.parse(JSON.stringify(o,(k,v)=>typeof v=='string'&&v.length>80?v.slice(0,80)+'…':v))}catch(e){return null}};
 const d=JSON.stringify({city:S.set.city,from:BUS.from,loc:BUS.loc,counts:{vehicleRows:BD.vlCount,matchedRides:BD.vlMatched},errors:{main:BD.err,rideStops:BD.rsErr,vehicles:BD.vlErr},sample:{stop:short(BD.stop),rideStop:short(BD.rs),vehicle:short(BD.vl)}},null,1);
 openSh(`<div class="shd">${t('Debug')}</div><textarea class="f nt" rows="14" readonly onclick="this.select()" style="font-size:12px;font-family:ui-monospace,monospace">${esc(d)}</textarea>`)}
/* ---------- boot ---------- */
load();applyLang();render(1);
$('#gb').onclick=settings;
setInterval(()=>{due();if(tab==0&&!$('#sh')){const[h,l]=hero(),a=$('#hv'),b=$('#hl'),nn=$('#nn'),bw=$('#bw');if(a&&(a.textContent!=h||b.innerHTML!=l)){a.textContent=h;b.innerHTML=l}if(nn){const x=nowNext();if(nn.innerHTML!=x)nn.innerHTML=x}if(bw){const x=bar(today());if(bw.innerHTML!=x)bw.innerHTML=x}}},15000);
setInterval(()=>{if(tab==3&&!$('#sh')&&!document.hidden)busLoad(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){due();if(!$('#sh')){if(sel<today()&&tab!=1)sel=today();render(0,true)}}});
due();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
