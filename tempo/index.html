<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempo</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#f4f4f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="stylesheet" href="tokens.css">
<style>
.hero{text-align:center;padding:34px 0 26px}.hero .hv{font-size:68px}.hl{font-weight:800;font-size:15px;color:var(--s2);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.duo b{display:block;font-size:26px;font-weight:800;margin-top:4px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 14px}.hd h1{margin:0}.hd .sub{margin-bottom:6px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:54px;border-top:1px solid var(--hr);cursor:pointer}.li:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:50%;background:var(--fl);display:grid;place-items:center;flex:none;font-size:19px}
.gt{flex:1;min-width:0}.gt>b{display:block;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--fl2);flex:none;display:grid;place-items:center;color:#fff;transition:transform .3s var(--spring),background .2s,border-color .2s}.ck:active{transform:scale(.85)}
.ck svg{transform:scale(0);transition:transform .3s var(--spring)}
.dn .ck{background:var(--a);border-color:var(--a)}.dn .ck svg{transform:scale(1)}.dn .gt>b{text-decoration:line-through;color:var(--s)}.dn .ic{opacity:.5}
.nw{margin:0 -10px;padding:11px 10px;border-radius:18px;background:color-mix(in srgb,var(--a) 12%,transparent);border-top-color:transparent}
.empty{padding:26px 0;text-align:center;color:var(--s);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dy{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:20px;transition:transform .25s var(--spring),background .2s,color .2s}.dy:active{transform:scale(.94)}
.dy small{font-size:11px;font-weight:700;color:var(--s);text-transform:uppercase}.dy b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.dy .dots{display:flex;gap:3px;height:5px}.dy .dots i{width:5px;height:5px;border-radius:50%;background:var(--a)}
.dy.td b{color:var(--a)}.dy.on{background:var(--t);color:var(--bg)}.dy.on small,.dy.on b{color:var(--bg)}.dy.on .dots i{background:var(--bg)}
.wn{display:flex;align-items:center;gap:8px}.wn .ib{width:40px;height:40px;box-shadow:none}
.rw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2 .f{margin:0 0 10px;min-width:0}
input[type=date].f,input[type=time].f{min-height:54px;-webkit-appearance:none;appearance:none;text-align:start}
.ems{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 12px;padding:2px 4px}.ems::-webkit-scrollbar{display:none}.ems button{width:44px;height:44px;border-radius:50%;background:var(--fl);font-size:20px;flex:none;transition:transform .25s var(--spring)}.ems button.on{background:var(--t);transform:scale(1.08)}
.pv{min-height:20px;margin:-2px 4px 12px;color:var(--a);font-weight:700;font-size:13.5px}
.lb{font-size:12.5px;font-weight:800;color:var(--s);margin:4px 6px 6px;text-transform:uppercase;letter-spacing:.05em}
#tp{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);background:var(--t);color:var(--bg);padding:12px 18px;border-radius:24px;font-weight:700;font-size:14.5px;z-index:30;max-width:90%;transition:transform .45s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.2)}#tp.o{transform:translate(-50%,0)}
#ts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--t);color:var(--bg);padding:12px 8px 12px 18px;border-radius:24px;font-weight:700;font-size:14.5px;z-index:30;display:flex;gap:10px;align-items:center;transition:transform .35s var(--spring),opacity .25s;pointer-events:none}#ts.o{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#ts button{padding:4px 12px;border-radius:14px;background:rgba(127,127,127,.3);font-weight:800}
.gr select{background:var(--fl);border:0;border-radius:12px;color:var(--t);font:700 14px inherit;padding:8px 10px}
.xb{width:100%;display:flex}
</style></head><body><div id="app"></div>
<div class="fabs"><button class="ib" id="gb" aria-label="Settings"></button><button class="ib p" id="fab" aria-label="Add" style="background:var(--t);color:var(--bg)"></button></div>
<nav id="nav"></nav><div id="tp"></div><div id="ts"><span id="tt"></span><button id="tu"></button></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* ---------- icons ---------- */
const P={today:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',week:'<rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',later:'<path d="M5 7h14M5 12h14M5 17h9"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/>',left:'<path d="M14.5 6l-6 6 6 6"/>',right:'<path d="M9.5 6l6 6-6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.1"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
const ic=(n,s=24)=>`<svg class="${n=='left'||n=='right'?'fl':''}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
/* ---------- i18n ---------- */
const HE={'Today':'היום','Week':'שבוע','Later':'אחר כך','New':'חדש','Edit':'עריכה','Settings':'הגדרות','Next up':'הבא','Now':'עכשיו','Free':'פנוי','All clear':'הכול בוצע','left':'נשארו','Done':'בוצעו','Left':'נותרו','Missed':'הוחמצו','Nothing planned. Tap + to add.':'אין תוכניות. לחצו + להוספה.','Nothing here. Tap + to add.':'אין כלום. לחצו + להוספה.','Title':'כותרת','What\'s the plan? e.g. Gym tomorrow 18:30 1h':'מה התוכנית? למשל: חדר כושר מחר 18:30 שעה','Date':'תאריך','Time':'שעה','Duration':'משך','Remind me':'תזכורת','Repeat':'חזרה','Off':'כבוי','At time':'בזמן','before':'לפני','Never':'לא','Daily':'יומי','Weekly':'שבועי','Save':'שמירה','Delete':'מחיקה','Deleted':'נמחק','Undo':'ביטול','General':'כללי','Language':'שפה','Theme':'עיצוב','Light':'בהיר','System':'מערכת','Dark':'כהה','Week starts':'השבוע מתחיל','Sun':'א׳','Mon':'ב׳','Reminders':'תזכורות','Notifications':'התראות','Default reminder':'תזכורת ברירת מחדל','Send a test':'שלח בדיקה','Data':'נתונים','Export backup':'ייצוא גיבוי','Import backup':'ייבוא גיבוי','Erase everything':'מחיקת הכול','Erase all your plans?':'למחוק את כל התוכניות?','Imported':'יובא','Test from Tempo':'בדיקה מ-Tempo','It works.':'זה עובד.','Starting now':'מתחיל עכשיו','Starts in':'מתחיל בעוד','min':'דק׳','in':'בעוד','Allowed':'מותר','Blocked in browser settings':'חסום בהגדרות הדפדפן','Needs Add to Home Screen first':'צריך קודם להוסיף למסך הבית','Quick add':'הוספה מהירה','Whole day':'כל היום','Tap to add a time':'ללא שעה','Notifications are not supported here.':'ההתראות לא נתמכות כאן.',
'info.notif':'התראות מופיעות כשהאפליקציה פתוחה או ברקע. באייפון צריך קודם "הוסף למסך הבית". כשהאפליקציה סגורה לגמרי אין התראה בלי שרת דחיפה.','info.rem':'כמה זמן לפני כל אירוע חדש להתריע.','info.quick':'אפשר לכתוב בשפה חופשית: "פגישה מחר 14:00 שעה" והאפליקציה תמלא לבד.','info.data':'הכול נשמר רק בטלפון הזה. מומלץ לייצא גיבוי מדי פעם.'};
const EN={'info.notif':'Alerts show while the app is open or in the background. On iPhone, Add to Home Screen first. With the app fully closed there is no alert without a push server.','info.rem':'How long before a new event to alert you.','info.quick':'Type naturally: "Dentist tomorrow 14:00 1h" and Tempo fills in the rest.','info.data':'Everything is stored only on this phone. Export a backup now and then.'};
let S;const lang=()=>S.set.lang,t=k=>lang()=='he'?(HE[k]||k):(EN[k]||k);
const loc=()=>lang()=='he'?'he-IL':'en-GB';
/* ---------- state ---------- */
const KEY='tempo.v1';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.items)S={items:[],set:{}};S.set=Object.assign({lang:/^he/.test(navigator.language)?'he':'en',theme:'',ws:0,notif:true,rem:10},S.set);S.fired=S.fired||{}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- dates ---------- */
const z=n=>String(n).padStart(2,'0'),dk=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date()),nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m},ft=m=>`${z(Math.floor(m/60)%24)}:${z(m%60)}`;
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtD=(s,o)=>new Intl.DateTimeFormat(loc(),o).format(pd(s));
const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m}m`;
function weekStart(s){const d=pd(s);const diff=(d.getDay()-S.set.ws+7)%7;d.setDate(d.getDate()-diff);return dk(d)}
/* ---------- model ---------- */
function hit(it,ds){if(!it.date)return false;if(ds<it.date)return false;if(!it.rep||it.rep=='none')return ds==it.date;const n=dayDiff(it.date,ds);return it.rep=='daily'||n%7==0}
const isDone=(it,ds)=>!!(it.done&&it.done[ds||'x']);
const byTime=(a,b)=>(a.time?tm(a.time):-1)-(b.time?tm(b.time):-1)||a.title.localeCompare(b.title);
const occ=ds=>S.items.filter(i=>hit(i,ds)).sort(byTime);
const later=()=>S.items.filter(i=>!i.date).sort((a,b)=>isDone(a)-isDone(b)||a.created-b.created);
const missed=()=>{const t=today(),out=[];S.items.forEach(i=>{if(i.date&&(!i.rep||i.rep=='none')&&i.date<t&&i.date>=addD(t,-14)&&!isDone(i,i.date))out.push(i)});return out.sort((a,b)=>a.date.localeCompare(b.date))};
function toggle(id,ds){const it=S.items.find(i=>i.id==id);it.done=it.done||{};const k=ds||'x';if(it.done[k])delete it.done[k];else it.done[k]=1;save();render(0,true)}
/* ---------- quick-add parser ---------- */
const DAYS=[['sun','sunday','ראשון'],['mon','monday','שני'],['tue','tues','tuesday','שלישי'],['wed','wednesday','רביעי'],['thu','thur','thurs','thursday','חמישי'],['fri','friday','שישי'],['sat','saturday','שבת']];
const EM=[[/gym|workout|run|train|yoga|אימון|ריצה|כושר|יוגה/i,'💪'],[/doctor|dentist|clinic|רופא|שיניים|קליניקה/i,'🩺'],[/call|phone|שיחה|טלפון/i,'📞'],[/meet|sync|פגישה|ישיבה/i,'👥'],[/lunch|dinner|breakfast|eat|coffee|ארוחה|קפה|אוכל|צהריים|ערב/i,'🍽️'],[/study|exam|class|lesson|לימוד|מבחן|שיעור|קורס/i,'📚'],[/work|project|עבודה|פרויקט/i,'💼'],[/birthday|party|יום הולדת|מסיבה/i,'🎉'],[/buy|shop|groceries|קניות|סופר/i,'🛒'],[/flight|trip|travel|טיסה|טיול/i,'✈️'],[/sleep|nap|שינה/i,'😴']];
const EMS=['📌','💪','💼','📚','👥','🍽️','🩺','📞','🛒','🎉','✈️','🧘','🎯','🏠','💡','❤️'];
const guess=s=>{for(const[r,e]of EM)if(r.test(s))return e;return '📌'};
function parse(txt,base){
 const r={title:txt,date:null,time:null,dur:null},U='(?<![\\p{L}\\d])',V='(?![\\p{L}\\d])';
 const cut=re=>{const m=r.title.match(re);if(m)r.title=r.title.replace(re,' ');return m};
 let m;
 if(m=cut(new RegExp(U+'(\\d{1,2})[:.](\\d{2})'+V,'iu')))r.time=`${z(+m[1]%24)}:${m[2]}`;
 else if(m=cut(new RegExp(U+'(\\d{1,2})\\s?(am|pm)'+V,'iu'))){let h=+m[1]%12;if(/pm/i.test(m[2]))h+=12;r.time=`${z(h)}:00`}
 else if(m=cut(new RegExp('(?:'+U+'at|(?<![\\p{L}])ב)\\s?(\\d{1,2})(?![\\d:])','iu')))r.time=`${z(+m[1]%24)}:00`;
 if(m=cut(new RegExp(U+'(\\d+(?:\\.\\d+)?)\\s?(?:h|hr|hrs|hours?|שעות|שעה|ש)'+V,'iu')))r.dur=Math.round(parseFloat(m[1])*60);
 else if(m=cut(new RegExp(U+'(\\d+)\\s?(?:m|min|mins|minutes?|דקות|דק)'+V,'iu')))r.dur=+m[1];
 else if(cut(new RegExp('(?<![\\p{L}])שעה(?![\\p{L}])','u')))r.dur=60;
 const T=base||today();
 if(cut(new RegExp(U+'(today|tod|היום)'+V,'iu')))r.date=T;
 else if(cut(new RegExp(U+'(tomorrow|tmr|tmrw|מחר)'+V,'iu')))r.date=addD(T,1);
 else for(let w=0;w<7&&!r.date;w++){const re=new RegExp(U+'(?:next\\s|יום\\s)?('+DAYS[w].join('|')+')'+V,'iu');if(cut(re)){const d=pd(T);r.date=addD(T,((w-d.getDay()+7)%7)||7)}}
 r.title=r.title.replace(/\s+/g,' ').trim();for(let k=0;k<3;k++)r.title=r.title.replace(/(^|\s)(at|for|on|next)$/i,'').replace(/^(at|for|on)\s/i,'').replace(/(^|\s)ב-?$/,'').trim();
 return r}
/* ---------- UI plumbing ---------- */
let tab=0,sel=today(),editing=null;const TABS=['Today','Week','Later'],TI=['today','week','later'];
function applyLang(){document.documentElement.lang=lang();document.documentElement.dir=lang()=='he'?'rtl':'ltr';if(S.set.theme)document.documentElement.dataset.theme=S.set.theme;else delete document.documentElement.dataset.theme;
 const dark=S.set.theme=='dark'||(!S.set.theme&&matchMedia('(prefers-color-scheme:dark)').matches);const c=dark?'#121214':'#f4f4f6';$$('meta[name=theme-color]').forEach(m=>m.content=c)}
function row(it,ds,o={}){const dn=isDone(it,ds),st=it.time?tm(it.time):null,en=st!=null?st+(it.dur||0):null,td=ds==today();
 const cur=td&&!dn&&st!=null&&nowMin()>=st&&nowMin()<(en>st?en:st+1);
 const late=!dn&&((ds&&ds<today())||(td&&en!=null&&nowMin()>=Math.max(en,st+1)));
 let sub=it.time?(it.dur?`${it.time}–${ft(en)}`:it.time):(it.date?t('Whole day'):'');
 if(o.showDate&&ds)sub=fmtD(ds,{weekday:'short',day:'numeric',month:'short'})+(it.time?' · '+it.time:'');
 if(it.rep&&it.rep!='none')sub+=' · ↻';
 return `<div class="li ${dn?'dn':''} ${cur?'nw':''}" onclick="edit('${it.id}','${ds||''}')"><button class="ck" aria-label="done" onclick="event.stopPropagation();toggle('${it.id}','${ds||''}')">${ic('check',16)}</button><span class="ic">${esc(it.emoji||'📌')}</span><span class="gt"><b>${esc(it.title)}</b><span class="sub ${late?'neg':''}">${sub}</span></span></div>`}
const list=(arr,ds,o)=>arr.length?arr.map(i=>row(i,ds,o)).join(''):`<div class="empty">${t(o&&o.later?'Nothing here. Tap + to add.':'Nothing planned. Tap + to add.')}</div>`;
function hero(){const td=today(),n=nowMin(),its=occ(td).filter(i=>!isDone(i,td));const timed=its.filter(i=>i.time);
 const cur=timed.find(i=>{const s=tm(i.time);return n>=s&&n<s+Math.max(i.dur||0,1)}),nxt=timed.find(i=>tm(i.time)>n);
 const hm=m=>m>=60?`${Math.floor(m/60)}h ${m%60?m%60+'m':''}`.trim():`${m}m`;
 if(cur){const e=tm(cur.time)+(cur.dur||1);return[hm(e-n),`${t('Now')} · ${cur.emoji||''} ${esc(cur.title)}`]}
 if(nxt)return[hm(tm(nxt.time)-n),`${t('Next up')} · ${nxt.emoji||''} ${esc(nxt.title)}`];
 if(its.length)return[String(its.length),t('left')];
 return[occ(td).length?'✓':'—',occ(td).length?t('All clear'):t('Free')]}
function view(){
 if(tab==0){const td=today(),all=occ(td),dn=all.filter(i=>isDone(i,td)).length,[h,l]=hero(),ms=missed();
  return `<div class="hd"><h1>${t('Today')}</h1><span class="sub">${fmtD(td,{weekday:'long',day:'numeric',month:'long'})}</span></div>
  <div class="hero"><div class="hv" id="hv">${h}</div><div class="hl" id="hl">${l}</div></div>
  <div class="duo"><div class="st"><span class="sub">${t('Left')}</span><b>${all.length-dn}</b></div><div class="st sv"><span class="sub">${t('Done')}</span><b class="pos">${dn}</b></div></div>
  ${ms.length?`<div class="sec"><span>${t('Missed')}</span></div><div class="card">${ms.map(i=>row(i,i.date,{showDate:1})).join('')}</div>`:''}
  <div class="sec"><span>${t('Today')}</span></div><div class="card">${list(all,td)}</div>`}
 if(tab==1){const w=weekStart(sel),days=[...Array(7)].map((_,i)=>addD(w,i)),td=today();
  return `<div class="hd"><h1>${fmtD(sel,{month:'long'})}</h1><div class="wn"><button class="ib" onclick="shift(-7)" aria-label="prev">${ic('left',20)}</button><button class="pill" onclick="sel=today();render(0,true)">${t('Today')}</button><button class="ib" onclick="shift(7)" aria-label="next">${ic('right',20)}</button></div></div>
  <div class="strip">${days.map(d=>{const n=occ(d).length;return `<button class="dy ${d==sel?'on':''} ${d==td?'td':''}" onclick="sel='${d}';render(0,true)"><small>${fmtD(d,{weekday:'short'})}</small><b>${pd(d).getDate()}</b><span class="dots">${'<i></i>'.repeat(Math.min(n,3))}</span></button>`}).join('')}</div>
  <div class="sec" style="margin-top:10px"><span>${fmtD(sel,{weekday:'long',day:'numeric',month:'short'})}</span></div><div class="card" id="wk">${list(occ(sel),sel)}</div>`}
 const L=later();return `<div class="hd"><h1>${t('Later')}</h1><span class="sub">${L.filter(i=>!isDone(i)).length}</span></div><div class="card">${list(L,null,{later:1})}</div>`}
function render(anim,keep){const y=scrollY;$('#app').innerHTML=`<div class="${anim?'va':''}">${view()}</div>`;
 $('#nav').innerHTML=TABS.map((n,i)=>`<button class="${i==tab?'on':''}" onclick="go(${i})">${ic(TI[i])}<span>${t(n)}</span></button>`).join('');
 $('#fab').innerHTML=ic('plus',26);$('#gb').innerHTML=ic('gear',22);if(keep)scrollTo(0,y)}
function go(i){if(i==tab)return scrollTo({top:0,behavior:'smooth'});tab=i;sel=i==1?today():sel;render(1);scrollTo(0,0)}
function shift(n){sel=addD(sel,n);render(1,true)}
/* swipe between days on Week */
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx==null||tab!=1||$('#sh'))return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70){const d=(lang()=='he'?-1:1)*(dx<0?1:-1);shift(d)}},{passive:true});
/* ---------- sheets ---------- */
function openSh(html,after){closeSh(true);const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=()=>closeSh();const s=document.createElement('div');s.className='sh';s.id='sh';s.innerHTML=html;document.body.append(o,s);after&&after(s);requestAnimationFrame(()=>requestAnimationFrame(()=>{o.classList.add('o');s.classList.add('o')}))}
function closeSh(now){const o=$('#ov'),s=$('#sh');if(!o)return;o.id=s.id='';o.classList.remove('o');s.classList.remove('o');if(now){o.remove();s.remove()}else setTimeout(()=>{o.remove();s.remove()},380)}
function segPlace(el,i,anim){const b=el.querySelectorAll('button')[i],h=el.querySelector('i');if(!b||!b.offsetWidth)return;if(!anim)h.style.transition='none';h.style.left=b.offsetLeft+'px';h.style.width=b.offsetWidth+'px';if(!anim){void h.offsetWidth;h.style.transition=''}}
const REMS=[[-1,'Off'],[0,'At time'],[5,'5'],[10,'10'],[30,'30'],[60,'60']],DURS=[15,30,45,60,90,120],REPS=[['none','Never'],['daily','Daily'],['weekly','Weekly']];
let F;
function edit(id,ds){const it=id?S.items.find(i=>i.id==id):null;
 F=it?{id:it.id,title:it.title,date:it.date,time:it.time||'',dur:it.dur||0,rem:it.rem??-1,rep:it.rep||'none',emoji:it.emoji||'📌',pick:true}
  :{title:'',date:tab==2?null:(tab==1?sel:today()),time:'',dur:S.set.dur||30,rem:S.set.rem,rep:'none',emoji:'📌',pick:false};
 const pills=(a,cur,fn,lab)=>a.map(x=>`<button class="pill ${x[0]==cur?'on':''}" onclick="${fn}('${x[0]}')">${lab(x)}</button>`).join('');
 openSh(`<div class="shd">${t(it?'Edit':'New')}</div>
 <input class="f" id="fi" maxlength="120" autocomplete="off" placeholder="${t("What's the plan? e.g. Gym tomorrow 18:30 1h")}" value="${esc(F.title)}" enterkeyhint="done">
 <div class="pv" id="pv"></div>
 <div class="f2"><input class="f" type="date" id="fd" value="${F.date||''}"><input class="f" type="time" id="ft" value="${F.time}"></div>
 <div class="lb">${t('Duration')}</div><div class="rw" id="rd"></div>
 <div class="lb">${t('Remind me')}</div><div class="rw" id="rr"></div>
 <div class="lb">${t('Repeat')}</div><div class="rw" id="rp"></div>
 <div class="ems" id="re"></div>
 <div class="trio">${it?`<button class="ib" aria-label="delete" id="bd" style="color:var(--r)">${ic('trash')}</button>`:''}<button class="ib p" aria-label="save" id="bs">${ic('check')}</button></div>`,s=>{
  const fi=$('#fi');const draw=()=>{
   $('#rd').innerHTML=DURS.map(d=>`<button class="pill ${F.dur==d?'on':''}" data-d="${d}">${dur(d)}</button>`).join('');
   $('#rr').innerHTML=REMS.map(r=>`<button class="pill ${F.rem==r[0]?'on':''}" data-r="${r[0]}">${r[0]>1?r[1]+' '+t('min'):t(r[1])}</button>`).join('');
   $('#rp').innerHTML=REPS.map(r=>`<button class="pill ${F.rep==r[0]?'on':''}" data-p="${r[0]}">${t(r[1])}</button>`).join('');
   $('#re').innerHTML=EMS.map(e=>`<button class="${F.emoji==e?'on':''}" data-e="${e}">${e}</button>`).join('')};
  const prev=()=>{const p=parse(fi.value,F.date||today()),b=[];if(p.date)b.push(fmtD(p.date,{weekday:'short',day:'numeric',month:'short'}));if(p.time)b.push(p.time);if(p.dur)b.push(dur(p.dur));$('#pv').textContent=b.length?'✦ '+b.join(' · '):'';if(!F.pick){F.emoji=guess(fi.value);const ee=$('#re');if(ee&&ee.children.length){[...ee.children].forEach(c=>c.classList.toggle('on',c.dataset.e==F.emoji))}}return p};
  draw();prev();
  fi.oninput=prev;s.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.d)F.dur=+d.d;else if(d.r)F.rem=+d.r;else if(d.p)F.rep=d.p;else if(d.e){F.emoji=d.e;F.pick=true}else return;draw();prev()};
  fi.onkeydown=e=>{if(e.key=='Enter')$('#bs').click()};
  $('#bs').onclick=()=>{const p=parse(fi.value,$('#fd').value||F.date||today());const title=p.title||fi.value.trim();if(!title){fi.focus();return}
   let date=p.date||$('#fd').value||null,time=p.time||$('#ft').value||'';if(F.rep!='none'&&!date)date=today();
   const o={title,date,time,dur:time?(p.dur||F.dur):0,rem:time?F.rem:-1,rep:date?F.rep:'none',emoji:F.pick?F.emoji:guess(title)};
   if(F.id)Object.assign(S.items.find(i=>i.id==F.id),o);else S.items.push(Object.assign({id:uid(),created:Date.now(),done:{}},o));
   if(date&&tab==1)sel=date;save();closeSh();render(0,true);due()};
  const bd=$('#bd');if(bd)bd.onclick=()=>{const i=S.items.findIndex(x=>x.id==F.id),old=S.items[i];S.items.splice(i,1);save();closeSh();render(0,true);toast(t('Deleted'),()=>{S.items.splice(i,0,old);save();render(0,true)})};
  if(!it)setTimeout(()=>fi.focus(),420)})}
$('#fab').onclick=()=>edit();
/* toast + top pill */
let tto;function toast(m,undo){$('#tt').textContent=m;$('#tu').textContent=t('Undo');$('#tu').style.display=undo?'':'none';$('#tu').onclick=()=>{undo&&undo();$('#ts').classList.remove('o')};$('#ts').classList.add('o');clearTimeout(tto);tto=setTimeout(()=>$('#ts').classList.remove('o'),4500)}
let pto;function pillMsg(m){$('#tp').textContent=m;$('#tp').classList.add('o');clearTimeout(pto);pto=setTimeout(()=>$('#tp').classList.remove('o'),5000)}
/* ---------- settings ---------- */
const group=(title,rows)=>`<div class="grp"><button class="gl gh" onclick="this.closest('.grp').classList.toggle('c')"><span>${t(title)}</span><span class="gch">${ic('chev',16)}</span></button><div class="gcw"><div class="gc">${rows}</div></div></div>`;
const info=k=>`<div class="gx"><div><div class="gi">${t(k)}</div></div></div>`;
const infoBtn=`<button class="ii" aria-label="info" onclick="event.stopPropagation();this.classList.toggle('o');this.closest('.gw').querySelector('.gx').classList.toggle('o')">${ic('info',18)}</button>`;
const segH=(id,labels)=>`<div class="seg sm" id="${id}"><i></i>${labels.map(l=>`<button>${l}</button>`).join('')}</div>`;
function notifState(){if(!('Notification'in window))return t('Notifications are not supported here.');const p=Notification.permission;return p=='granted'?t('Allowed'):p=='denied'?t('Blocked in browser settings'):''}
function settings(){openSh(`<div class="shd">${t('Settings')}</div>`+
 group('General',`<div class="gw"><div class="gr"><span class="gt">${t('Language')}</span>${segH('s1',['English','עברית'])}</div></div><div class="gw"><div class="gr"><span class="gt">${t('Theme')}</span>${segH('s2',[t('Light'),t('System'),t('Dark')])}</div></div><div class="gw"><div class="gr"><span class="gt">${t('Week starts')}</span>${segH('s3',[t('Sun'),t('Mon')])}</div></div>`)+
 group('Reminders',`<div class="gw"><div class="gr" role="button" id="tn"><span class="gt">${t('Notifications')}<div class="sub" id="ns">${notifState()}</div></span>${infoBtn}<span class="tg ${S.set.notif&&Notification.permission=='granted'?'on':''}" id="tgn"></span></div>${info('info.notif')}</div>
 <div class="gw"><div class="gr"><span class="gt">${t('Default reminder')}</span>${infoBtn}<select id="dr">${REMS.map(r=>`<option value="${r[0]}" ${S.set.rem==r[0]?'selected':''}>${r[0]>1?r[1]+' '+t('min'):t(r[1])}</option>`).join('')}</select></div>${info('info.rem')}</div>
 <div class="gw"><div class="gr" role="button" id="tt2"><span class="gt">${t('Send a test')}</span></div></div>`)+
 group('Data',`<div class="gw"><div class="gr" role="button" id="ex"><span class="gt">${t('Export backup')}</span>${infoBtn}</div>${info('info.data')}</div><div class="gw"><label class="gr" role="button"><span class="gt">${t('Import backup')}</span><input type="file" id="im" accept="application/json" hidden></label></div><div class="gw"><div class="gr" role="button" id="er"><span class="gt neg">${t('Erase everything')}</span></div></div>`),s=>{
  const sg=(id,i,fn)=>{const el=$('#'+id);const bs=[...el.querySelectorAll('button')];bs.forEach((b,k)=>{b.classList.toggle('on',k==i);b.onclick=()=>{bs.forEach((x,j)=>x.classList.toggle('on',j==k));segPlace(el,k,true);fn(k)}});segPlace(el,i,false)};
  sg('s1',S.set.lang=='he'?1:0,k=>{S.set.lang=k?'he':'en';save();applyLang();render(0,true);setTimeout(settings,0)});
  sg('s2',S.set.theme=='light'?0:S.set.theme=='dark'?2:1,k=>{S.set.theme=['light','','dark'][k];save();applyLang()});
  sg('s3',S.set.ws,k=>{S.set.ws=k;save();render(0,true)});
  $('#tn').onclick=async()=>{if(!('Notification'in window)){$('#ns').textContent=notifState();return}
   if(S.set.notif&&Notification.permission=='granted'){S.set.notif=false;$('#tgn').classList.remove('on')}
   else{if(Notification.permission=='default'){try{await Notification.requestPermission()}catch(e){}}if(Notification.permission=='granted'){S.set.notif=true;$('#tgn').classList.add('on')}}
   $('#ns').textContent=notifState();save()};
  $('#dr').onchange=e=>{S.set.rem=+e.target.value;save()};
  $('#tt2').onclick=()=>notify(t('Test from Tempo'),t('It works.'),'test'+Date.now());
  $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items:S.items,set:S.set})],{type:'application/json'}));a.download='tempo-backup-'+today()+'.json';a.click()};
  $('#im').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j.items)){S.items=j.items;Object.assign(S.set,j.set||{});save();applyLang();closeSh();render(0,true);toast(t('Imported'))}}catch(x){}};
  $('#er').onclick=()=>{if(confirm(t('Erase all your plans?'))){S.items=[];S.fired={};save();closeSh();render(0,true)}}})}
/* ---------- notifications ---------- */
async function notify(title,body,tag){pillMsg(title+' · '+body);
 if(!('Notification'in window)||Notification.permission!='granted')return;
 try{const reg=await navigator.serviceWorker.getRegistration();if(reg)return reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',renotify:true});new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}}
function due(){if(!S.set.notif)return;const now=Date.now(),td=today();
 for(const ds of [addD(td,-1),td,addD(td,1)])for(const it of occ(ds)){if(!it.time||it.rem<0||it.rem==null||isDone(it,ds))continue;
  const at=pd(ds).getTime()+tm(it.time)*6e4-it.rem*6e4,key=it.id+ds;
  if(now>=at&&now-at<15*6e4&&!S.fired[key]){S.fired[key]=now;save();notify(`${it.emoji||'📌'} ${it.title}`,it.rem?`${t('Starts in')} ${it.rem} ${t('min')} · ${it.time}`:`${t('Starting now')} · ${it.time}`,key)}}
 for(const k in S.fired)if(now-S.fired[k]>2*864e5)delete S.fired[k]}
/* ---------- boot ---------- */
load();applyLang();render(1);
$('#gb').onclick=settings;
setInterval(()=>{due();if(tab==0&&!$('#sh')){const[h,l]=hero(),a=$('#hv'),b=$('#hl');if(a&&(a.textContent!=h||b.innerHTML!=l)){a.textContent=h;b.innerHTML=l}}},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){due();if(!$('#sh')){if(sel<today()&&tab!=1)sel=today();render(0,true)}}});
due();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
